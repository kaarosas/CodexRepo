<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Capture App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Client Capture</h1>
      <form id="client-form">
        <label>
          Name
          <input type="text" name="name" required />
        </label>
        <label>
          Email
          <input type="email" name="email" required />
        </label>
        <label>
          Phone
          <input type="text" name="phone" />
        </label>
        <label>
          Notes
          <textarea name="notes" rows="3"></textarea>
        </label>
        <button type="submit">Save Client</button>
      </form>
      <p id="status"></p>

      <section>
        <h2>Saved Clients</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Notes</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="client-list"></tbody>
        </table>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
